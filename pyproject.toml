[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-mem"
version = "0.1.0"
description = "Local-first memory for AI agents. Zero dependencies. JSON, vector, or hybrid backends."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Hussain Al-Saibai", email = "hussain.alsaibai@gmail.com"}]
keywords = ["ai", "agent", "memory", "vector-search", "rag", "mcp", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-mem"
Issues = "https://github.com/hussain-alsaibai/tiny-mem/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tiny_mem = ["py.typed"]
